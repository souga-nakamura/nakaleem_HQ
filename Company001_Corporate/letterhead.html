<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nakaleem Industries — Letterhead</title>
<style>
  :root{
    --ink:#12100e; --ink2:#4a4540; --line:#e6e0d8; --paper:#ffffff;
    --gold:#b8923f; --deep:#1c2b2a; --accent:#2f6f68;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
    color:var(--ink); background:#d8d2c8;
  }
  .page{
    position:relative;
    width:210mm; min-height:297mm;
    margin:24px auto; background:var(--paper);
    box-shadow:0 8px 30px rgba(0,0,0,.18);
    padding:18mm 18mm;
    display:flex; flex-direction:column;
  }
  .header{
    display:flex; justify-content:space-between; align-items:flex-start;
    padding-bottom:10mm; border-bottom:2px solid var(--deep);
  }
  .brand .name{
    font-size:24px; font-weight:800; letter-spacing:.04em; color:var(--deep);
    text-transform:uppercase;
  }
  .brand .sub{
    font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold);
    font-weight:700; margin-top:4px;
  }
  .mark{
    width:46px; height:46px;
    flex-shrink:0;
  }
  .mark img{width:100%; height:100%; object-fit:contain; display:block;}
  .brand-row{display:flex; gap:14px; align-items:center;}
  .watermark{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:110mm; height:110mm; opacity:.25; pointer-events:none; z-index:0;
  }
  .watermark img{width:100%; height:100%; object-fit:contain;}
  .header,.body-area,.footer{position:relative; z-index:1;}
  .contact{
    text-align:right; font-size:11px; color:var(--ink2); line-height:1.7;
  }
  .contact .label{
    font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--gold);
    font-weight:700; display:block; margin-bottom:2px;
  }
  .body-area{ flex:1; padding-top:14mm; }
  .rule-thin{width:40px; height:2px; background:var(--gold); margin-bottom:10mm;}
  .footer{
    border-top:1px solid var(--line); padding-top:6mm; margin-top:auto;
    display:flex; justify-content:space-between; align-items:center;
    font-size:9.5px; color:var(--ink2); letter-spacing:.03em;
  }
  .footer b{color:var(--deep);}
  .toolbar{position:fixed; top:16px; right:16px; z-index:99;}
  .toolbar button{
    font:inherit; font-size:13px; font-weight:700; padding:10px 16px; border:none;
    border-radius:10px; background:var(--deep); color:#fff; cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,.18);
  }
  .toolbar button:hover{background:#000;}

  @media print{
    @page{ size:A4 portrait; margin:0; }
    html,body{background:#fff;}
    .page{
      width:210mm; height:297mm; min-height:297mm; margin:0; box-shadow:none;
      padding:18mm 18mm;
      -webkit-print-color-adjust:exact; print-color-adjust:exact;
    }
    .toolbar{display:none !important;}
  }
</style>
</head>
<body>

<div class="toolbar"><button onclick="window.print()">PDF / Print</button></div>

<div class="page">
  <div class="watermark"><img src="logo/3.png" alt=""></div>

  <div class="header">
    <div class="brand-row">
      <div class="mark"><img src="logo/3.png" alt="Nakaleem Industries logo"></div>
      <div class="brand">
        <div class="name">Nakaleem Industries</div>
        <div class="sub">(Pvt.) Ltd.</div>
      </div>
    </div>
    <div class="contact">
      <span class="label">Registered Address</span>
      176 Y Block, DHA Phase 3<br>Lahore, Pakistan
      <div style="height:8px"></div>
      <span class="label">Email</span>
      nakaleemindustries@gmail.com
    </div>
  </div>

  <div class="body-area">
    <div class="rule-thin"></div>
    <!-- Letter content goes here -->
  </div>

  <div class="footer">
    <div><b>Nakaleem Industries (Pvt.) Ltd.</b> · 176 Y Block, DHA Phase 3, Lahore, Pakistan</div>
    <div>nakaleemindustries@gmail.com</div>
  </div>
</div>

</body>
</html>
